<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1ABC9C" />
  <title>Movestock — Reconnecting…</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px; margin-bottom: 1.5rem;
      border-radius: 50%;
      background: #E1F5EE;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #E1F5EE;
      border-top-color: #1ABC9C;
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #6b7280; font-size: 0.875rem; max-width: 320px; line-height: 1.5; margin-bottom: 1.25rem; }
    .status { color: #1ABC9C; font-size: 0.8125rem; margin-bottom: 1.5rem; font-weight: 500; }
    button {
      display: inline-block;
      background: #1ABC9C; color: #fff;
      font-weight: 600; font-size: 0.875rem;
      padding: 0.75rem 1.75rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    button:active { background: #15A886; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Reconnecting…</h1>
  <p>Your connection is slow or your phone's network just woke up. We'll keep trying — tap below if it doesn't load on its own.</p>
  <p class="status"><span class="spinner"></span>Retrying automatically…</p>
  <button type="button" onclick="location.reload()">Try again now</button>
  <script>
    // Auto-retry every 6 seconds. The SW navigation timeout is 25s, so two
    // automatic retries cover ~37s of "slow network" before the user has to
    // intervene manually. If the device really is offline, retrying loops
    // through this page harmlessly.
    setTimeout(function () { location.reload(); }, 6000);
  </script>
</body>
</html>
